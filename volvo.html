<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Le code d'autorisation ne doit jamais fuiter vers un autre site -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>myCar · Redirection</title>
    <style>
      :root { color-scheme: light dark; --bg: #f4f6f9; --text: #141821; --muted: #5d6675; --danger: #b91c1c; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0e1116; --text: #e6e9ef; --muted: #9aa4b2; --danger: #f87171; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
      main { max-width: 460px; text-align: center; }
      h1 { font-size: 1.4rem; margin: 0 0 8px; } h1 span { color: #2563eb; }
      p { margin: 0; color: var(--muted); } p.error { color: var(--danger); }
    </style>
  </head>
  <body>
    <main>
      <h1><span>my</span>Car</h1>
      <p id="msg">Retour vers votre application myCar…</p>
    </main>
    <script>
      /*
       * Page relais OAuth2 (adresse de retour déclarée chez Volvo).
       * Volvo exige une adresse https publique ; cette page renvoie simplement le navigateur, avec les
       * paramètres reçus (code, state, error…), vers l'instance myCar qui a démarré la connexion.
       * L'instance est encodée dans "state" (aléa + "." + URL en base64url) par le back myCar.
       * Le code seul est inutilisable : son échange exige le client secret et le code_verifier PKCE,
       * qui restent sur votre serveur.
       */
      ;(function () {
        var BRAND = 'volvo'
        // Instances autorisées hors réseau local (à compléter, ex. 'https://mycar.mondomaine.fr')
        var EXTRA_ORIGINS = []

        var msg = document.getElementById('msg')
        function fail(text) {
          msg.textContent = text
          msg.className = 'error'
        }

        var params = new URLSearchParams(location.search)
        var state = params.get('state') || ''
        var dot = state.lastIndexOf('.')
        if (dot < 0) return fail('Lien de retour invalide : relancez la connexion depuis myCar.')

        var target
        try {
          var b64 = state.slice(dot + 1).replace(/-/g, '+').replace(/_/g, '/')
          target = new URL(atob(b64 + '==='.slice((b64.length + 3) % 4)))
        } catch (e) {
          return fail('Instance myCar inconnue : relancez la connexion depuis myCar.')
        }

        var host = target.hostname
        var isLocal =
          host === 'localhost' ||
          host === '127.0.0.1' ||
          /^10\./.test(host) ||
          /^192\.168\./.test(host) ||
          /^172\.(1[6-9]|2\d|3[01])\./.test(host) ||
          /\.local$/.test(host)
        var allowed = (target.protocol === 'http:' || target.protocol === 'https:') &&
          (isLocal || EXTRA_ORIGINS.indexOf(target.origin) !== -1)
        if (!allowed) return fail('Instance myCar non autorisée (' + target.origin + '). Ajoutez-la à EXTRA_ORIGINS dans cette page.')

        var base = target.origin + target.pathname.replace(/\/+$/, '')
        location.replace(base + '/api/connections/oauth/' + BRAND + '/callback' + location.search)
      })()
    </script>
  </body>
</html>
